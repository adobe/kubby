[package]
name = "kubby"
version = "0.60.1"
description = "Kubby is a cross-platform desktop application for managing Kubernetes clusters. It is intended as a richer, GUI-based alternative to the popular terminal tool k9s, targeted at developers and SREs who work with multiple clusters and namespaces every day."
authors = ["Adrian Tosca"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kubby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.1", features = [] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-clipboard-manager = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
serde_yaml = "0.9"
chrono = "0.4"
tokio = { version = "1", features = ["process", "time", "fs", "io-util", "sync", "macros"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"

[target.'cfg(debug_assertions)'.dependencies]
tauri-plugin-webdriver = "0.2"
