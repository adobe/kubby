# HTTPProxy CRD from Contour (simplified for local testing)
# Full CRD: https://github.com/projectcontour/contour/blob/main/examples/contour/01-crds.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httpproxies.projectcontour.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
spec:
  group: projectcontour.io
  names:
    kind: HTTPProxy
    listKind: HTTPProxyList
    plural: httpproxies
    shortNames:
      - proxy
      - proxies
    singular: httpproxy
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: FQDN
          type: string
          jsonPath: .spec.virtualhost.fqdn
        - name: TLS Secret
          type: string
          jsonPath: .spec.virtualhost.tls.secretName
        - name: Status
          type: string
          jsonPath: .status.currentStatus
        - name: Status Description
          type: string
          jsonPath: .status.description
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                virtualhost:
                  type: object
                  properties:
                    fqdn:
                      type: string
                    tls:
                      type: object
                      properties:
                        secretName:
                          type: string
                        minimumProtocolVersion:
                          type: string
                        maximumProtocolVersion:
                          type: string
                        passthrough:
                          type: boolean
                includes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      conditions:
                        type: array
                        items:
                          type: object
                          properties:
                            prefix:
                              type: string
                            header:
                              type: object
                              properties:
                                name:
                                  type: string
                                present:
                                  type: boolean
                                contains:
                                  type: string
                                notcontains:
                                  type: string
                                exact:
                                  type: string
                                notexact:
                                  type: string
                routes:
                  type: array
                  items:
                    type: object
                    properties:
                      conditions:
                        type: array
                        items:
                          type: object
                          properties:
                            prefix:
                              type: string
                            header:
                              type: object
                              properties:
                                name:
                                  type: string
                                present:
                                  type: boolean
                                contains:
                                  type: string
                                notcontains:
                                  type: string
                                exact:
                                  type: string
                                notexact:
                                  type: string
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            port:
                              type: integer
                            weight:
                              type: integer
                            protocol:
                              type: string
                      timeoutPolicy:
                        type: object
                        properties:
                          response:
                            type: string
                          idle:
                            type: string
                      retryPolicy:
                        type: object
                        properties:
                          count:
                            type: integer
                          perTryTimeout:
                            type: string
                      permitInsecure:
                        type: boolean
                      enableWebsockets:
                        type: boolean
                tcpproxy:
                  type: object
                  properties:
                    services:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          port:
                            type: integer
                          weight:
                            type: integer
            status:
              type: object
              properties:
                currentStatus:
                  type: string
                description:
                  type: string
                loadBalancer:
                  type: object
                  properties:
                    ingress:
                      type: array
                      items:
                        type: object
                        properties:
                          hostname:
                            type: string
                          ip:
                            type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
