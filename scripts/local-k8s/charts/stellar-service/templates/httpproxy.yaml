{{- if .Values.httpProxy.enabled }}
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ include "stellar-service.fullname" . }}
  labels:
    {{- include "stellar-service.labels" . | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ .Values.httpProxy.fqdn | default (printf "%s.stellar.local" (include "stellar-service.fullname" .)) }}
    {{- if .Values.httpProxy.tlsSecretName }}
    tls:
      secretName: {{ .Values.httpProxy.tlsSecretName }}
    {{- end }}
  routes:
    - conditions:
        - prefix: /
      services:
        - name: {{ include "stellar-service.fullname" . }}
          port: {{ .Values.service.port }}
      timeoutPolicy:
        response: 30s
        idle: 60s
      retryPolicy:
        count: 3
        perTryTimeout: 10s
    - conditions:
        - prefix: /health
      services:
        - name: {{ include "stellar-service.fullname" . }}
          port: {{ .Values.service.port }}
      permitInsecure: true
    - conditions:
        - prefix: /metrics
      services:
        - name: {{ include "stellar-service.fullname" . }}
          port: {{ .Values.service.metricsPort }}
{{- end }}
