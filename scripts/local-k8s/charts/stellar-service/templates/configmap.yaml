apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stellar-service.fullname" . }}-config
  labels:
    {{- include "stellar-service.labels" . | nindent 4 }}
data:
  log-level: {{ .Values.config.logLevel | quote }}
  metrics-enabled: {{ .Values.config.metricsEnabled | quote }}
  max-connections: {{ .Values.config.maxConnections | quote }}
  timeout-seconds: {{ .Values.config.timeoutSeconds | quote }}
  feature-flags.json: |
    {
      "enableCache": {{ .Values.config.featureFlags.enableCache }},
      "enableRateLimiting": {{ .Values.config.featureFlags.enableRateLimiting }},
      "enableTracing": {{ .Values.config.featureFlags.enableTracing }}
    }
