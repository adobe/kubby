# Kubby configuration for local Stellar testing environment
# This mimics the structure of production kubby configurations

# readOnly: true
# liveViewAutoRefresh: true
# refreshRateSeconds: 2
# metricsRefreshRateSeconds: 30
# kubectlTimeoutSeconds: 10

contexts:
  groups:
    # Nebula Platform (Managed K8s #1)
    - name: "Nebula"
      contexts:
        - group: live
          contexts:
            - name: live-kappa-nebula237-live-kappa
            - name: live-omicron-nebula12-live-omicron
            - name: live-gamma-nebula24-live-gamma
            - name: live-delta-nebula08-live-delta
            - name: live-epsilon-nebula14-live-epsilon
            - name: live-zeta-nebula07-live-zeta
            - name: live-eta-nebula15-live-eta
            - name: live-theta-nebula10-live-theta
        - group: preview
          contexts:
            - name: preview-kappa-nebula27-preview-kappa
        - group: sandbox
          contexts:
            - name: sandbox-kappa-nebula24-sandbox-kappa
      namespaces:
        - name: "Core Services"
          namespaces:
            - name: ns-team-stellar-domains
            - name: ns-team-stellar-operations
              contexts:
                - live-kappa-nebula237-live-kappa
                - live-omicron-nebula12-live-omicron
                - live-epsilon-nebula14-live-epsilon
                - live-zeta-nebula07-live-zeta
            - name: ns-team-stellar-data-stores
            - name: ns-team-stellar-schema-services
            - name: ns-team-stellar-workflow-schedulers
        - name: "Observability"
          namespaces:
            - name: ns-team-tenant-stellar-observability
        - name: "Infrastructure"
          namespaces:
            - name: global-proxy-controllers
            - name: global-monitoring

    # Cosmos Platform (Managed K8s #2)
    - name: "Cosmos"
      contexts:
        - group: live
          contexts:
            - name: live-kappa-cosmos-0
            - name: live-kappa-cosmos-1
            - name: live-omicron-cosmos-0
            - name: live-omicron-cosmos-1
            - name: live-gamma-cosmos-0
        - group: preview
          contexts:
            - name: preview-kappa-cosmos-0
      namespaces:
        - name: "Domain Services"
          namespaces:
            - name: stellar-identity-kappa-live
              contexts:
                - live-kappa-cosmos-0
                - live-kappa-cosmos-1
            - name: stellar-identity-omicron-live
              contexts:
                - live-omicron-cosmos-0
                - live-omicron-cosmos-1
            - name: stellar-identity-kappa-preview
              contexts:
                - preview-kappa-cosmos-0

# Resource commands configuration
resources:
  run:
    - name: "Test Network Multitool"
      command: "kubectl run test-network-multitool --context $context --namespace $namespace --image=praqma/network-multitool --labels=$labels --restart=Never --command -- sleep infinity"
      resources: ["pod"]
    - name: "Debug Selected Pod"
      command: "kubectl debug --context $context --namespace $namespace $name -it --image=busybox -- sh"
      resources: ["pod"]
    - name: "Port Forward to Pod"
      command: "kubectl port-forward --context $context --namespace $namespace $name 8080:8080"
      resources: ["pod", "service"]

# AI Assistant Configuration
ai:
  tool: claude
  name: Agent
  readOnly: true

# Testing overrides (replaces external tool launches with noop commands for e2e tests)
testing:
  shellOverride: "touch /tmp/kubby-e2e-shell"
  aiToolOverride: "touch /tmp/kubby-e2e-ai"
  editorOverride: "touch /tmp/kubby-e2e-editor"
